<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="Judge score minus human score. On questions picked for being disputed, phi4 is 44 points below the human; on randomly drawn questions, 2 points below." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title>Bias depends on where the reference was drawn</title><desc>Judge score minus human score. On questions picked for being disputed, phi4 is 44 points below the human; on randomly drawn questions, 2 points below.</desc><text x="0.0" y="18.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Judge score minus human score, by how the question was chosen</text><line x1="1.0" y1="38.0" x2="21.0" y2="38.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="11.0" cy="38.0" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><text x="26.0" y="42.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">21 questions picked because a judge disputed them</text><line x1="351.0" y1="38.0" x2="371.0" y2="38.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="361.0" cy="38.0" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="376.0" y="42.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">29 questions drawn at random</text><line x1="200.0" y1="58.0" x2="200.0" y2="226.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="200.0" y="242.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">-60</text><line x1="300.0" y1="58.0" x2="300.0" y2="226.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="300.0" y="242.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">-40</text><line x1="400.0" y1="58.0" x2="400.0" y2="226.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="400.0" y="242.0" font-size="11" fill="#52514e" text-anchor="middle" font-weigh