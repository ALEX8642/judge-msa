<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" width="760" height="246" role="img" aria-label="Per judge: the smallest v2 minus v1 difference it can resolve, about 19 to 21 points, and the 30 to 37 point difference it reported." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title>What each judge can resolve</title><desc>Per judge: the smallest v2 minus v1 difference it can resolve, about 19 to 21 points, and the 30 to 37 point difference it reported.</desc><text x="0.0" y="18.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Smallest difference each judge can resolve, v2 − v1</text><rect x="0" y="33" width="14" height="10" rx="2" fill="#2a78d6"/><text x="22.0" y="42.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">cannot resolve below this (bias bound + noise)</text><line x1="327.0" y1="38.0" x2="347.0" y2="38.0" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="337.0" cy="38.0" r="4.5" fill="#0b0b0b" stroke="#ffffff" stroke-width="2"/><text x="352.0" y="42.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">difference the judge reported, 95% interval</text><line x1="150.0" y1="58.0" x2="150.0" y2="202.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="150.0" y="218.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">0</text><line x1="232.0" y1="58.0" x2="232.0" y2="202.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="232.0" y="218.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">10</text><line x1="314.0" y1="58.0" x2="314.0" y2="202.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="314.0" y="218.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">20</text><line x1="396.0" y1="58.0" x2="396.0" y2="202.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="396.0" y="218.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">30</text><line x1="478.0" y1="58.0" x2="478.0" y2="202.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="478.0" y="218.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">40</text><line x1="560.0" y1="58.0" x2="560.0" y2="202.0" stroke="#dedcd3" stroke-width="1.0" stroke-linecap="round"/><text x="560.0" y="218.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">50</text><text x="560.0" y="236.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">percentage points</text><text x="0.0" y="91.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">phi4</text><path d="M150.0,79.0 h161.4 a4.0,4.0 0 0 1 4.0,4.0 v8.0 a4.0,4.0 0 0 1 -4.0,4.0 h-161.4 z" fill="#2a78d6"/><line x1="390.4" y1="87.0" x2="525.2" y2="87.0" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="456.8" cy="87.0" r="5.0" fill="#0b0b0b" stroke="#ffffff" stroke-width="2"/><text x="574.0" y="84.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">reported +37.4</text><text x="574.0" y="100.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">resolves above 20.2</text><text x="0.0" y="137.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">mistral-small</text><path d="M150.0,125.0 h154.8 a4.0,4.0 0 0 1 4.0,4.0 v8.0 a4.0,4.0 0 0 1 -4.0,4.0 h-154.8 z" fill="#2a78d6"/><line x1="348.9" y1="133.0" x2="489.6" y2="133.0" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="416.9" cy="133.0" r="5.0" fill="#0b0b0b" stroke="#ffffff" stroke-width="2"/><text x="574.0" y="130.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">reported +32.5</text><text x="574.0" y="146.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">resolves above 19.4</text><text x="0.0" y="183.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">gemma3</text><path d="M150.0