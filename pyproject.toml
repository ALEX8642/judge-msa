[project]
name = "judge-msa"
version = "0.1.0"
description = "Measurement system analysis (Gage R&R) for LLM judges"
readme = "README.md"
authors = [{ name = "Alexander Feht" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
judge-msa = "judge_msa.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
markers = ["slow: statistical validation by simulation"]
testpaths = ["tests"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
